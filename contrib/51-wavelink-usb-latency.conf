# wavelink-mixer: lower USB interface latency for the Scarlett Solo (period 256, headroom 128).
# Install: cp to ~/.config/wireplumber/wireplumber.conf.d/ && systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Focusrite_Scarlett_Solo.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 256,
        api.alsa.headroom = 128
      }
    }
  }
]
