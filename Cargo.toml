[package]
name = "wavelink-mixer"
version = "0.1.0"
edition = "2021"
description = "Wave Link-style mixer for the PipeWire channel/mix setup"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
